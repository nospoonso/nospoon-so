<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NoSpoon</title>

    <!-- Optimized Meta Description for Search Engines & AI Crawlers -->
    <meta name="description" content="NoSpoon is an app studio building consumer apps people can't stop sharing. Bend the internet and follow the white rabbit.">

    <!-- Tab Icon (Favicon) & Mobile Icons -->
    <link rel="icon" type="image/png" href="Favicon.png?v=2">
    <link rel="apple-touch-icon" href="Favicon.png?v=2">

    <!-- Mobile App Settings -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500&display=swap" rel="stylesheet">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }
        /* Lettera Text Medium loads only from the copy installed on this computer
           (trial licence: internal testing only, never upload the font file).
           Anyone without it installed sees Inter. */
        @font-face {
            font-family: 'NS Wordmark';
            src: local('Lettera Text Trial Medium'), local('LetteraTextTrial-Medium'),
                 local('Lettera Text Medium'), local('LetteraText-Medium');
        }
        .wordmark-text {
            font-family: 'NS Wordmark', 'Inter', sans-serif;
            font-weight: 500;
        }
        .wordmark {
            width: min(72vw, 760px);
            height: auto;
            display: block;
        }
        .footer {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            padding: 24px 16px 32px;
        }
        .social-link {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            color: #0F1A20;
            text-decoration: none;
            opacity: 0.85;
            transition: opacity 0.15s ease;
        }
        .social-link:hover,
        .social-link:focus-visible {
            opacity: 1;
        }
        .icon {
            width: 22px;
            height: 22px;
            display: block;
            fill: #0F1A20;
        }
        /* White Rabbit icon keeps its own red */
        .icon-rabbit {
            fill: #FF080C;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Logo + wordmark (vector, sharp at any size) -->
        <svg class="wordmark" viewBox="0 0 1040 284" role="img" aria-label="NoSpoon">
            <g fill="#0F1A20"><circle cx="142" cy="142" r="31"/><rect x="0" y="125.5" width="33" height="33"/><rect x="53" y="125.5" width="33" height="33"/><rect x="198" y="125.5" width="33" height="33"/><rect x="251" y="125.5" width="33" height="33"/><rect x="125.5" y="0" width="33" height="33"/><rect x="125.5" y="53" width="33" height="33"/><rect x="125.5" y="198" width="33" height="33"/><rect x="125.5" y="251" width="33" height="33"/></g>
            <text x="364" y="194.75" font-size="152.5" fill="#0F1A20" class="wordmark-text">NoSpoon</text>
        </svg>
    </div>

    <!-- Minimalist Footer -->
    <div class="footer">
        <!-- X Link -->
        <a href="https://x.com/nospoonso" target="_blank" rel="noopener" class="social-link" aria-label="NoSpoon on X">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"></path>
            </svg>
        </a>

        <!-- White Rabbit Link -->
        <a href="https://whiterabbit.nospoon.so" class="social-link" aria-label="White Rabbit">
            <svg class="icon icon-rabbit" viewBox="55.5 57 175 175" aria-hidden="true">
                <rect x="96.5" y="59" width="33" height="33"></rect>
                <rect x="156.5" y="59" width="33" height="33"></rect>
                <rect x="104.5" y="112" width="33" height="33"></rect>
                <rect x="148.5" y="112" width="33" height="33"></rect>
                <circle cx="142" cy="196" r="34"></circle>
            </svg>
        </a>

        <!-- LinkedIn Link -->
        <a href="https://www.linkedin.com/company/nospoonso" target="_blank" rel="noopener" class="social-link" aria-label="NoSpoon on LinkedIn">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"></path>
            </svg>
        </a>

    </div>

</body>
</html>
